# Production-style stack. Secrets come from a root .env file (copy .env.docker.example).
#   docker compose up -d --build
# The app is served on http://<host>:${APP_PORT:-8080}; the API is proxied under /api.
# Postgres and the backend are NOT published on the host network.

# Rotate container logs so they cannot fill the disk (3 x 10 MB per service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hr_attendance_db}
      TZ: Africa/Cairo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hr_attendance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hr_attendance_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see DOCKER.md)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Used only when RUN_SEED=true (first install): credentials of the first SUPER_ADMIN.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Cairo}
      TZ: ${APP_TIMEZONE:-Africa/Cairo}
      ABSENCE_JOB: ${ABSENCE_JOB:-on}
      DB_MIGRATE: ${DB_MIGRATE:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Optional HTTPS without a domain:  docker compose --profile https up -d
  # SITE_ADDRESS in .env, e.g. 203-0-113-10.sslip.io (your server's public IP with dashes)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-set-SITE_ADDRESS-in-env.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
